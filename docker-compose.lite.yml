# 本地单机：SQLite，不用 Redis / MySQL
# 启动：docker compose -f docker-compose.local.yml up -d
# 访问：http://localhost:3000  账号 root / 123456（登录后请改密码）

services:
  one-api:
    image: "${REGISTRY:-docker.io}/justsong/one-api:latest"
    container_name: one-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - /home/oneapi_data:/data
      - /home/logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - SESSION_SECRET=change-me-to-a-random-string
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'"]
      interval: 30s
      timeout: 10s
      retries: 3
